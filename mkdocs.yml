site_name: SWUIFT
site_description: User documentation for the SWUIFT wildfire–urban interface simulator
site_url: https://utkrshkmr.github.io/SWUIFT/
repo_url: https://github.com/utkrshkmr/SWUIFT
repo_name: utkrshkmr/SWUIFT
edit_uri: ""

theme:
  name: material
  language: en
  logo: assets/SWUIFT_logo.png
  favicon: assets/SWUIFT_logo.png
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Use light mode

nav:
  - Overview: index.md
  - Downloads: downloads.md
  - Install:
      - Windows, macOS, Linux: installation.md
      - Verify a release: verification.md
  - Use:
      - Quick Start: quick-start.md
      - Desktop GUI: gui.md
      - Command line: cli.md
      - Input schema: input-schema.md
      - Timezone codes: timezones.md
      - Marshall tutorial: marshall-tutorial.md
      - Expected outputs: outputs.md
  - Project:
      - Citation, DOI & license: citation-license.md
      - Troubleshooting & contact: troubleshooting.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/utkrshkmr/SWUIFT
      name: SWUIFT repository

copyright: Copyright &copy; 2026 The Research Foundation for the State University of New York
